<script>
document.addEventListener('DOMContentLoaded', function() {
  const infoBtn = document.getElementById('infoBtn');
  const closeSidebar = document.getElementById('closeSidebar');
  const infoSidebar = document.getElementById('infoSidebar');

  // Toggle Information Sidebar
  infoBtn.addEventListener('click', () => {
    infoSidebar.classList.add('active');
  });

  closeSidebar.addEventListener('click', () => {
    infoSidebar.classList.remove('active');
  });

  // Close sidebar on click outside
  document.addEventListener('click', (e) => {
    if (!infoSidebar.contains(e.target) && !infoBtn.contains(e.target) && infoSidebar.classList.contains('active')) {
      infoSidebar.classList.remove('active');
    }
  });

  // Handle Scroll Navigation background
  window.addEventListener('scroll', () => {
    const nav = document.querySelector('.tesla-nav');
    if (window.scrollY > 50) {
      nav.style.background = 'rgba(23, 26, 32, 0.8)';
      nav.style.backdropFilter = 'blur(10px)';
    } else {
      nav.style.background = 'transparent';
      nav.style.backdropFilter = 'none';
    }
  });

  // Function to update help content dynamically (called when switching steps)
  window.updateHelp = function(stepIndex) {
    google.script.run.withSuccessHandler(function(content) {
      document.getElementById('helpContent').innerHTML = `<h3>Hướng dẫn Bước ${stepIndex}</h3><p style="margin-top:20px; color:#ccc; line-height:1.6;">${content}</p>`;
    }).getHelpContent(stepIndex);
  }

  // Calculate Progress and Status (Step 1)
  window.calculateProgress = function(input) {
    const row = input.closest('tr');
    const target = parseFloat(row.cells[2].querySelector('input').value) || 0;
    const actual = parseFloat(row.cells[3].querySelector('input').value) || 0;
    const percentageCell = row.querySelector('.percentage-cell');
    const statusBadge = row.querySelector('.status-badge');

    if (target > 0) {
      const percentage = (actual / target) * 100;
      percentageCell.innerText = percentage.toFixed(1) + '%';

      if (percentage >= 100) {
        statusBadge.className = 'status-badge done';
        statusBadge.innerText = 'Hoàn thành';
      } else if (percentage <= 80) {
        statusBadge.className = 'status-badge failed';
        statusBadge.innerText = 'Không đạt';
      } else {
        statusBadge.className = 'status-badge near';
        statusBadge.innerText = 'Gần đạt';
      }
    } else {
      percentageCell.innerText = '0%';
      statusBadge.className = 'status-badge pending';
      statusBadge.innerText = 'Chờ cập nhật';
    }
  }

  // Add new row to evaluation table
  window.addRow = function() {
    const body = document.getElementById('evaluation-body');
    const newRow = document.createElement('tr');
    newRow.className = 'glass-row';
    newRow.innerHTML = `
      <td><input type="text" placeholder="Tên mục tiêu..." class="input-minimal"></td>
      <td><input type="text" placeholder="Người phụ trách" class="input-minimal"></td>
      <td><input type="number" placeholder="Số mục tiêu" class="input-minimal" oninput="calculateProgress(this)"></td>
      <td><input type="number" placeholder="Số thực tế" class="input-minimal" oninput="calculateProgress(this)"></td>
      <td class="percentage-cell">0%</td>
      <td><span class="status-badge pending">Chờ cập nhật</span></td>
    `;
    body.appendChild(newRow);
  }

  // Save data to Google Sheets
  window.saveData = function() {
    const rows = document.querySelectorAll('#evaluation-body tr');
    const data = Array.from(rows).map(row => ({
      goal: row.cells[0].querySelector('input').value,
      owner: row.cells[1].querySelector('input').value,
      target: row.cells[2].querySelector('input').value,
      actual: row.cells[3].querySelector('input').value
    }));
    
    console.log("Saving data:", data);
    alert("Dữ liệu đang được lưu vào Google Sheets...");
  }

  // Load Mock Data into UI
  window.loadMockData = function() {
    google.script.run.withSuccessHandler(function(data) {
      // Step 1: Evaluation
      const evalBody = document.getElementById('evaluation-body');
      evalBody.innerHTML = data.evaluation.map(item => `
        <tr class="glass-row">
          <td><input type="text" value="${item.goal}" class="input-minimal"></td>
          <td><input type="text" value="${item.owner}" class="input-minimal"></td>
          <td><input type="number" value="${item.target}" class="input-minimal" oninput="calculateProgress(this)"></td>
          <td><input type="number" value="${item.actual}" class="input-minimal" oninput="calculateProgress(this)"></td>
          <td class="percentage-cell">${((item.actual/item.target)*100).toFixed(1)}%</td>
          <td><span class="status-badge ${item.actual >= item.target ? 'done' : 'near'}">${item.actual >= item.target ? 'Hoàn thành' : 'Gần đạt'}</span></td>
        </tr>
      `).join('');

      // Step 2: SSK
      document.getElementById('start-list').innerHTML = data.ssk.start.map(s => `<li>${s}</li>`).join('');
      document.getElementById('stop-list').innerHTML = data.ssk.stop.map(s => `<li>${s}</li>`).join('');
      document.getElementById('keep-list').innerHTML = data.ssk.keep.map(s => `<li>${s}</li>`).join('');

      // Step 3: Business Data
      document.getElementById('mock-revenue').innerText = data.businessData.revenue.toLocaleString();
      document.getElementById('mock-profit').innerText = data.businessData.profit.toLocaleString();
      document.getElementById('mock-cashflow').innerText = data.businessData.cashflow.toLocaleString();

      // Step 5: 2026 Plan
      document.getElementById('plan-2026-body').innerHTML = data.plan2026.map(p => `
        <tr><td>${p.goal}</td><td>${p.priority}</td><td>${p.kpi}</td></tr>
      `).join('');

    }).getInitialData();
  }

  // Initial load
  loadMockData();

  // Intersection Observer to detect current step and update Help Sidebar
  const sections = document.querySelectorAll('section');
  const observerOptions = { threshold: 0.6 };
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const stepIndex = entry.target.id.replace('step', '');
        if (stepIndex) updateHelp(stepIndex);
      }
    });
  }, observerOptions);

  sections.forEach(section => observer.observe(section));
});
</script>

<style>
:root {
  --tesla-white: #ffffff;
  --tesla-black: #171a20;
  --tesla-grey: #393c41;
  --accent-blue: #3e6ae1;
  --glass-bg: rgba(255, 255, 255, 0.1);
  --glass-border: rgba(255, 255, 255, 0.2);
  --font-main: 'Inter', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-main);
  background-color: var(--tesla-black);
  color: var(--tesla-white);
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* Navigation */
.tesla-nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  z-index: 1000;
  background: transparent;
  transition: background 0.3s;
}

.logo {
  font-weight: 600;
  letter-spacing: 2px;
  font-size: 14px;
}

.nav-links a {
  color: var(--tesla-white);
  text-decoration: none;
  margin: 0 15px;
  font-size: 14px;
  font-weight: 400;
  transition: opacity 0.3s;
}

.nav-links a:hover {
  opacity: 0.7;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--tesla-white);
  cursor: pointer;
  transition: transform 0.2s;
}

.icon-btn:hover {
  transform: scale(1.1);
}

/* Sections */
section {
  height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  scroll-snap-align: start;
}

.hero-section {
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=2072') center/cover no-repeat;
}

.content-wrapper {
  text-align: center;
  max-width: 800px;
  z-index: 2;
}

h1 {
  font-size: 48px;
  font-weight: 600;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 14px;
  color: #e2e2e2;
  margin-bottom: 40px;
}

/* Glass Cards */
.goal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 30px;
  transition: transform 0.3s;
}

.glass:hover {
  transform: translateY(-5px);
}

/* Progress Bar */
.progress-bar {
  background: rgba(255,255,255,0.1);
  height: 6px;
  border-radius: 3px;
  margin: 15px 0;
  overflow: hidden;
}

.progress {
  background: var(--accent-blue);
  height: 100%;
  border-radius: 3px;
}

.status {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.status.near { color: #f1c40f; }
.status.done { color: #2ecc71; }
.status.failed { color: #e74c3c; }

/* Buttons */
.action-buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.btn-primary {
  background-color: var(--accent-blue);
  color: white;
  border: none;
  padding: 12px 60px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
}

.btn-outline {
  background-color: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid white;
  padding: 12px 60px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  backdrop-filter: blur(5px);
}

/* Sidebar */
.sidebar {
  position: fixed;
  right: -400px;
  top: 0;
  width: 400px;
  height: 100vh;
  background: rgba(23, 26, 32, 0.9);
  backdrop-filter: blur(20px);
  border-left: 1px solid var(--glass-border);
  z-index: 2000;
  transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 40px;
}

.sidebar.active {
  right: 0;
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.close-btn {
  background: none;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
}

.help-list {
  list-style: none;
  margin-top: 20px;
}

.help-list li {
  margin-bottom: 15px;
  font-size: 14px;
  color: #ccc;
  line-height: 1.6;
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-up { animation: fadeInUp 0.8s ease-out forwards; }
.animate-up-delay { animation: fadeInUp 0.8s 0.2s ease-out forwards; opacity: 0; }
.animate-up-delay-2 { animation: fadeInUp 0.8s 0.4s ease-out forwards; opacity: 0; }

/* Scroll Indicator */
.scroll-indicator {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
}

.mouse {
  width: 20px;
  height: 35px;
  border: 2px solid white;
  border-radius: 10px;
  position: relative;
}

.mouse::before {
  content: '';
  width: 2px;
  height: 6px;
  background: white;
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  animation: scroll 1.5s infinite;
}

@keyframes scroll {
  0% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(15px); }
}
</style>

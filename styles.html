<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

:root {
  --bg-deep: #050505;
  --bg-gradient: radial-gradient(circle at top right, #1a1a2e, #050505);
  --accent-primary: #00f2ff;
  --accent-secondary: #7000ff;
  --glass-white: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text-main: #ffffff;
  --text-dim: #a0a0a0;
  --font-main: 'Outfit', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-main);
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  overflow-x: hidden;
  line-height: 1.6;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

/* Navigation */
.tesla-nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 50px;
  z-index: 1000;
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
}

.logo {
  font-weight: 800;
  font-size: 20px;
  background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}

.nav-links a {
  color: var(--text-dim);
  text-decoration: none;
  margin: 0 20px;
  font-size: 14px;
  font-weight: 400;
  transition: all 0.3s;
}

.nav-links a:hover {
  color: var(--accent-primary);
  text-shadow: 0 0 10px var(--accent-primary);
}

/* Hero & Sections */
section {
  min-height: 100vh;
  padding: 120px 50px 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: clamp(32px, 5vw, 64px);
  font-weight: 800;
  margin-bottom: 15px;
  text-align: center;
  letter-spacing: -2px;
}

.subtitle {
  color: var(--text-dim);
  font-size: 18px;
  max-width: 600px;
  text-align: center;
  margin-bottom: 60px;
}

/* Bento Grid Dashboard */
.evaluation-container {
  width: 100%;
  max-width: 1200px;
}

.glass-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 10px;
}

.glass-table th {
  padding: 15px 25px;
  color: var(--text-dim);
  font-size: 12px;
  text-transform: uppercase;
  text-align: left;
}

.glass-row {
  background: var(--glass-white);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.glass-row:hover {
  transform: scale(1.02);
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--accent-primary);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.glass-row td {
  padding: 25px;
}

.glass-row td:first-child { border-radius: 15px 0 0 15px; }
.glass-row td:last-child { border-radius: 0 15px 15px 0; }

.input-minimal {
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
}

/* Status Badges */
.status-badge {
  padding: 8px 16px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  display: inline-block;
}

.status-badge.done { background: rgba(0, 242, 255, 0.1); color: var(--accent-primary); border: 1px solid var(--accent-primary); }
.status-badge.near { background: rgba(255, 214, 0, 0.1); color: #ffd600; border: 1px solid #ffd600; }
.status-badge.failed { background: rgba(255, 0, 85, 0.1); color: #ff0055; border: 1px solid #ff0055; }

/* SSK Columns */
.ssk-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  width: 100%;
  max-width: 1200px;
}

.ssk-box {
  background: var(--glass-white);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 40px;
  position: relative;
  overflow: hidden;
}

.ssk-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 4px;
}

.ssk-box:nth-child(1)::before { background: var(--accent-primary); }
.ssk-box:nth-child(2)::before { background: #ff0055; }
.ssk-box:nth-child(3)::before { background: #2ecc71; }

.ssk-box h3 {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 30px;
}

/* Sidebar */
.sidebar {
  position: fixed;
  right: -450px;
  top: 0;
  width: 450px;
  height: 100vh;
  background: rgba(5, 5, 5, 0.95);
  backdrop-filter: blur(40px);
  border-left: 1px solid var(--glass-border);
  z-index: 2000;
  padding: 60px;
  transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
}

.sidebar.active { right: 0; box-shadow: -50px 0 100px rgba(0,0,0,0.8); }

/* Buttons */
.btn-primary {
  background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
  border: none;
  padding: 18px 45px;
  border-radius: 100px;
  color: white;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2);
  transition: all 0.3s;
}

.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0, 242, 255, 0.4); }

.btn-add {
  background: transparent;
  border: 2px dashed var(--glass-border);
  padding: 20px;
  border-radius: 15px;
  width: 100%;
  color: var(--text-dim);
  cursor: pointer;
  margin-top: 20px;
  font-weight: 600;
}
</style>
